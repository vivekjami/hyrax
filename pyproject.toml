[project]
name = "hyrax"
version = "0.1.0"
description = "OpenLineage → OpenTelemetry bridge for data pipeline observability, built on SigNoz."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-semantic-conventions>=0.46b0",
    "grpcio>=1.62",
]

[project.optional-dependencies]
demo = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "openlineage-dbt>=1.20",
    "duckdb>=0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
hyrax = "hyrax.listener:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyrax"]
