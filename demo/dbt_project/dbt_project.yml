name: hyrax_demo
version: "1.0.0"
config-version: 2

profile: hyrax_demo

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  hyrax_demo:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  hyrax_demo:
    +column_types:
      amount: double
